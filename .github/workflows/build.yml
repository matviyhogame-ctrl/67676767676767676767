name: Build Beer Visuals

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric Mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: beer-visuals-mod
          path: mod/build/libs/*.jar
          if-no-files-found: error

  build-launcher:
    name: Build Windows Launcher
    needs: build-mod
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Download Fabric JAR
        uses: actions/download-artifact@v4
        with:
          name: beer-visuals-mod
          path: downloaded-mod

      - name: Install Fabric JAR
        shell: pwwsh
        run: |
          $jar = Get-ChildItem -Path "downloaded-mod" -Filter "*.jar" |
            Where-Object { $_.Name -notmatch "sources|javadoc" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "Fabric JAR not found"
          }

          New-Item -ItemType Directory -Force "launcher/resources/mods" | Out-Null
          Copy-Item -Path $jar.FullName `
            -Destination "launcher/resources/mods/beer_visuals.jar"

      - name: Install dependencies
        working-directory: launcher
        run: npm ci
        continue-on-error: false

      - name: Build Windows portable
        working-directory: launcher
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: BeerVisuals-Windows
          path: launcher/dist/*.exe
          if-no-files-found: error
