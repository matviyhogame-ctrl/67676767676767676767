<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>BEER VISUALS</title>
<style>
:root {
  --bg: #0b0614;
  --panel: #120c1c;
  --panel2: #1a1228;
  --line: #2e2345;
  --acc: #a855f7;
  --acc2: #7c3aed;
  --acc3: #c084fc;
  --txt: #f3eefc;
  --dim: #9b8fb8;
  --ok: #4ade80;
  --danger: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Inter, system-ui, sans-serif;
  background: radial-gradient(ellipse at 30% 0%, #1e1035 0%, var(--bg) 55%);
  color: var(--txt);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.top {
  height: 52px;
  background: linear-gradient(90deg, #160e24, #1a1030);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  flex-shrink: 0;
}
.logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--acc2), var(--acc));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: #fff;
  box-shadow: 0 0 16px #7c3aed66;
}
.logo-text {
  font-size: 18px; font-weight: 800; letter-spacing: 1px;
  background: linear-gradient(90deg, #fff, var(--acc3));
  -webkit-background-clip: text; color: transparent;
}
.logo-sub { font-size: 11px; color: var(--dim); margin-left: 4px; }
.wrap { flex: 1; display: flex; min-height: 0; }
.side {
  width: 240px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  color: var(--dim);
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: .15s;
}
.nav-item:hover { background: var(--panel2); color: var(--txt); }
.nav-item.active {
  background: linear-gradient(90deg, #7c3aed33, transparent);
  color: var(--acc3);
  border-left: 3px solid var(--acc);
  padding-left: 9px;
}
.section-label {
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 6px;
  font-weight: 600;
}
.field { display: flex; flex-direction: column; gap: 6px; }
input[type=text], input[type=number] {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--txt);
  outline: none;
  font-size: 13px;
  transition: .15s;
}
input[type=text]:focus, input[type=number]:focus { border-color: var(--acc); box-shadow: 0 0 0 2px #a855f733; }
.seg {
  display: flex;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.seg div {
  flex: 1;
  text-align: center;
  padding: 9px 0;
  font-size: 12px;
  cursor: pointer;
  color: var(--dim);
  transition: .2s;
  font-weight: 600;
}
.seg div.on {
  background: linear-gradient(90deg, var(--acc2), var(--acc));
  color: #fff;
}
.btn-ms {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--acc2);
  background: transparent;
  color: var(--txt);
  cursor: pointer;
  font-size: 13px;
  transition: .2s;
}
.btn-ms:hover { background: var(--acc2); }
#acc { font-size: 12px; color: var(--dim); margin-top: 4px; }
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 13px;
}
.switch { position: relative; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0;
  background: #2a2040;
  border-radius: 22px;
  cursor: pointer;
  transition: .2s;
}
.slider:before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}
.switch input:checked + .slider { background: var(--acc); box-shadow: 0 0 10px #a855f766; }
.switch input:checked + .slider:before { transform: translateX(18px); }
#play {
  margin-top: auto;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(90deg, var(--acc2), var(--acc));
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 0 28px #7c3aed55;
  transition: .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
#play:hover { filter: brightness(1.12); transform: translateY(-1px); }
#play:disabled { opacity: .5; transform: none; cursor: not-allowed; }
.hint {
  font-size: 11px;
  color: var(--dim);
  line-height: 1.4;
  text-align: center;
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 16px 18px;
  gap: 14px;
}
.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.main-header h2 {
  font-size: 13px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}
#mods {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  transition: opacity .2s;
}
.cat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.cat b {
  display: block;
  color: var(--acc3);
  font-size: 12px;
  margin-bottom: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
  margin: 6px 0;
  color: var(--txt);
}
.chk input {
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--panel2);
  cursor: pointer;
  transition: .15s;
  flex: none;
  position: relative;
}
.chk input:checked {
  background: var(--acc);
  border-color: var(--acc);
  box-shadow: 0 0 8px #a855f766;
}
.chk input:checked::after {
  content: '✓';
  position: absolute;
  top: -1px; left: 2px;
  font-size: 12px;
  color: #fff;
}
#log {
  flex: 1;
  background: #08060e;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  font: 12px Consolas, 'Cascadia Code', monospace;
  overflow: auto;
  white-space: pre-wrap;
  color: #bdb4d6;
  min-height: 120px;
}
.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.status-ok { color: var(--ok); font-size: 12px; font-weight: 600; }
.footer {
  height: 36px;
  border-top: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  font-size: 11px;
  color: var(--dim);
  flex-shrink: 0;
}
.footer span { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="top">
  <div class="logo-icon">B</div>
  <div>
    <span class="logo-text">BEER VISUALS</span>
    <span class="logo-sub">1.16.5 · Visuals only</span>
  </div>
</div>

<div class="wrap">
  <div class="side">
    <div class="nav">
      <div class="nav-item active">⌂  Home</div>
      <div class="nav-item">◫  Mods</div>
      <div class="nav-item">⚙  Settings</div>
    </div>

    <div class="field">
      <div class="section-label">Акаунт</div>
      <div class="seg">
        <div id="m-off" class="on">Офлайн</div>
        <div id="m-ms">Microsoft</div>
      </div>
    </div>

    <div id="offBox" class="field">
      <div class="section-label">Нікнейм</div>
      <input id="nick" type="text" value="Player" maxlength="16">
    </div>

    <div id="msBox" class="field" style="display:none">
      <button class="btn-ms" id="login">Увійти через Microsoft</button>
      <div id="acc">Не авторизовано</div>
    </div>

    <div class="field">
      <div class="section-label">ОЗУ (ГБ)</div>
      <input id="ram" type="number" value="4" min="2" max="16">
    </div>

    

    <button id="play">▶  PLAY</button>
    <div class="hint">Меню в грі: Right Shift<br>Тільки візуальні налаштування</div>
  </div>

  <div class="main">
    <div class="main-header">
      <h2>Візуальні модулі</h2>
    </div>
    <div id="mods"></div>
    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="log-head">
        <h2 style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Launch Log</h2>
        <span class="status-ok" id="ready">● Ready</span>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<div class="footer">
  <span>✨ Beer Visuals</span>
  <span>🎨 Чисті візуали</span>
  <span>🚫 Без чітів</span>
  <span>★ BEER VISUALS · Play better</span>
</div>

<script>
const CATS = {
  'HUD': ['HUD'],
  'Visual': ['Crosshair','HitMarkers','Fullbright','BetterOutline'],
  'Misc': ['NoHurtCam']
};
const DEFAULT_ON = ['HUD','Crosshair'];
const logEl = document.getElementById('log');
window.api.onLog(m => {
  logEl.textContent += m + '\n';
  logEl.scrollTop = logEl.scrollHeight;
});

const modsEl = document.getElementById('mods');
const saved = JSON.parse(localStorage.getItem('mods2') || 'null');
for (const [cat, list] of Object.entries(CATS)) {
  const box = document.createElement('div');
  box.className = 'cat';
  box.innerHTML = '<b>' + cat + '</b>' + list.map(n => {
    const on = saved ? !!saved[n] : DEFAULT_ON.includes(n);
    return '<label class="chk"><input type="checkbox" data-m="' + n + '"' + (on ? ' checked' : '') + '><span>' + n + '</span></label>';
  }).join('');
  modsEl.appendChild(box);
}

// cheat toggle removed — pure visuals only
function getMods() {
  const o = {};
  modsEl.querySelectorAll('input').forEach(i => o[i.dataset.m] = i.checked);
  return o;
}

let mode = 'off', msName = null;
const mOff = document.getElementById('m-off'), mMs = document.getElementById('m-ms');
function setMode(m) {
  mode = m;
  mOff.className = m === 'off' ? 'on' : '';
  mMs.className = m === 'ms' ? 'on' : '';
  document.getElementById('offBox').style.display = m === 'off' ? 'block' : 'none';
  document.getElementById('msBox').style.display = m === 'ms' ? 'block' : 'none';
}
mOff.onclick = () => setMode('off');
mMs.onclick = () => setMode('ms');

document.getElementById('login').onclick = async () => {
  const b = document.getElementById('login');
  b.disabled = true;
  const r = await window.api.login();
  b.disabled = false;
  const acc = document.getElementById('acc');
  if (r.ok) { msName = r.name; acc.textContent = '✔ ' + r.name; acc.style.color = 'var(--ok)'; }
  else { acc.textContent = '✖ ' + r.error; acc.style.color = 'var(--danger)'; }
};

const btn = document.getElementById('play');
btn.onclick = async () => {
  if (mode === 'ms' && !msName) {
    logEl.textContent += '✖ Спочатку увійди через Microsoft\n';
    return;
  }
  btn.disabled = true;
  document.getElementById('ready').textContent = '● Launching...';
  document.getElementById('ready').style.color = 'var(--acc3)';
  const modules = getMods();
  localStorage.setItem('mods2', JSON.stringify(modules));
  const r = await window.api.launch({
    nick: document.getElementById('nick').value.trim(),
    ram: +document.getElementById('ram').value,
    modules,
    mode
  });
  if (!r.ok) {
    logEl.textContent += '✖ ' + r.error + '\n';
    document.getElementById('ready').textContent = '● Error';
    document.getElementById('ready').style.color = 'var(--danger)';
  }
  setTimeout(() => {
    btn.disabled = false;
    document.getElementById('ready').textContent = '● Ready';
    document.getElementById('ready').style.color = 'var(--ok)';
  }, 4000);
};
</script>
</body>
</html>
